name: Release MacVM
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (for example 0.2.0); leave empty to increment the latest patch'
        required: false
        type: string
      publish:
        description: 'Publish a GitHub release after verification (disable for a signed validation build)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
concurrency:
  group: macvm-release
  cancel-in-progress: false

jobs:
  windows-helpers:
    permissions:
      contents: read
    uses: ./.github/workflows/windows-guest-helpers.yml
  release:
    needs: windows-helpers
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
      MACOS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate contract, secrets, and version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source .github/release-contract.env
          [[ "$GITHUB_REPOSITORY" == "$GITHUB_OWNER/$GITHUB_REPO" ]]
          [[ "$APPLE_TEAM_ID" == "$TEAM_IDENTIFIER" && "$TEAM_IDENTIFIER" == "66K3EFBVB6" ]]
          for key in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_INSTALLER_P12_BASE64 MACOS_INSTALLER_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "Missing secret: $key"; exit 1; }
          done
          VERSION="$REQUESTED_VERSION"
          if [[ -z "$VERSION" ]]; then
            LATEST="$(git tag --list 'v*' --sort=-version:refname | head -1)"
            if [[ -z "$LATEST" ]]; then VERSION=0.2.0; else
              IFS=. read -r major minor patch <<< "${LATEST#v}"
              VERSION="$major.$minor.$((patch + 1))"
            fi
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ! git rev-parse "v$VERSION" >/dev/null 2>&1
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          cat .github/release-contract.env >> "$GITHUB_ENV"
      - name: Import Developer ID into temporary Keychain
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/macvm-release.keychain-db"
          INSTALLER_KEYCHAIN="$RUNNER_TEMP/macvm-installer.keychain-db"
          CERT="$RUNNER_TEMP/macvm-signing.p12"
          INSTALLER_CERT="$RUNNER_TEMP/macvm-installer-signing.p12"
          trap 'rm -f "$CERT" "$INSTALLER_CERT"' EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT"
          printf '%s' "$MACOS_INSTALLER_P12_BASE64" | base64 --decode > "$INSTALLER_CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$INSTALLER_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$INSTALLER_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$INSTALLER_KEYCHAIN"
          security import "$INSTALLER_CERT" -P "$MACOS_INSTALLER_PASSWORD" -k "$INSTALLER_KEYCHAIN" -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$INSTALLER_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$INSTALLER_KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ && /66K3EFBVB6/ {print $2; exit}')"
          [[ -n "$IDENTITY" ]]
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          INSTALLER_IDENTITY="$(security find-identity -v -p basic "$INSTALLER_KEYCHAIN" | awk '/Developer ID Installer/ && /66K3EFBVB6/ {print $2; exit}')"
          [[ -n "$INSTALLER_IDENTITY" ]] || { echo 'Developer ID Installer identity missing.'; exit 1; }
          echo "INSTALLER_SIGN_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "INSTALLER_KEYCHAIN=$INSTALLER_KEYCHAIN" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials macvm-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$KEYCHAIN"
      - uses: actions/download-artifact@v4
        with:
          name: MacVM-Windows-Guest-Helpers
          path: ${{ runner.temp }}/windows-guest-build
      - name: Prepare bundled Windows engine and signed ARM64 Tools
        env:
          WINDOWS_GUEST_HELPERS_DIR: ${{ runner.temp }}/windows-guest-build/windows-guest-helpers
        run: ./scripts/prepare-windows-engine.sh
      - name: Test and build
        env:
          CONFIGURATION: release
          REQUIRE_GUEST_TOOLS_RELEASE_TRUST: '1'
          GUEST_TOOLS_NOTARY_PROFILE: macvm-release
          REQUIRE_WINDOWS_ENGINE: '1'
        run: |
          swift test
          WINDOWS_TEST_BUNDLE="$(swift build --show-bin-path)/WindowsPrototypeTests.xctest"
          if [[ -d "$WINDOWS_TEST_BUNDLE" ]]; then
            xcrun xctest "$WINDOWS_TEST_BUNDLE"
          else
            swift test --skip-build --filter WindowsPrototypeTests
          fi
          ./scripts/verify-downloads.sh
          ./scripts/verify-update-installer.sh
          ./scripts/build-app.sh
          python3 ./scripts/verify-windows-engine.py dist/MacVM.app/Contents/Resources/Helpers/MacVMRunner.app/Contents/Resources/WindowsEngine
          PLIST="dist/$APP_BUNDLE_NAME/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" == "$APP_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" == "$BUNDLE_IDENTIFIER" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")" == "$EXECUTABLE_NAME" ]]
          pkgutil --check-signature "dist/$GUEST_TOOLS_ASSET_NAME"
          xcrun stapler validate "dist/$GUEST_TOOLS_ASSET_NAME"
          spctl --assess --type install --verbose=4 "dist/$GUEST_TOOLS_ASSET_NAME"
      - name: Verify publisher and notarize app
        run: |
          set -euo pipefail
          APP="dist/$APP_BUNDLE_NAME"
          for target in "$APP" "$APP/Contents/Resources/Helpers/MacVMRunner.app"; do
            codesign --verify --strict --verbose=4 "$target"
            SIGNATURE="$(codesign -dv --verbose=4 "$target" 2>&1)"
            [[ "$SIGNATURE" == *"TeamIdentifier=$TEAM_IDENTIFIER"* ]]
            [[ "$SIGNATURE" == *"runtime"* ]] # Build signs with --options runtime.
          done
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/MacVM.zip"
          xcrun notarytool submit "$RUNNER_TEMP/MacVM.zip" --keychain-profile macvm-release --keychain "$RUNNER_TEMP/macvm-release.keychain-db" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
      - name: Create, notarize, and verify DMG
        run: |
          set -euo pipefail
          ./scripts/create-dmg.sh
          DMG="dist/$DMG_ASSET_NAME"
          xcrun notarytool submit "$DMG" --keychain-profile macvm-release --keychain "$RUNNER_TEMP/macvm-release.keychain-db" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --strict --verbose=4 "$DMG"
          [[ "$(codesign -dv --verbose=4 "$DMG" 2>&1)" == *"TeamIdentifier=$TEAM_IDENTIFIER"* ]]
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          shasum -a 256 "$DMG"
          ./scripts/create-update-manifest.sh # Publishes MacVM.dmg.update.json alongside the DMG.
      - name: Save verified build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacVM-${{ env.APP_VERSION }}-${{ github.run_id }}
          path: |
            dist/${{ env.DMG_ASSET_NAME }}
            dist/${{ env.MANIFEST_ASSET_NAME }}
            dist/${{ env.GUEST_TOOLS_ASSET_NAME }}
            dist/MacVM-Windows-Sources.tar.gz
          if-no-files-found: error
      - name: Publish verified release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$APP_VERSION"
          git push origin "v$APP_VERSION"
          gh release create "v$APP_VERSION" "dist/$DMG_ASSET_NAME" "dist/$MANIFEST_ASSET_NAME" "dist/$GUEST_TOOLS_ASSET_NAME" dist/MacVM-Windows-Sources.tar.gz --verify-tag --title "MacVM $APP_VERSION" --notes-file docs/release-notes.md
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/macvm-release.keychain-db" || true
          security delete-keychain "$RUNNER_TEMP/macvm-installer.keychain-db" || true
          rm -f "$RUNNER_TEMP/macvm-signing.p12" "$RUNNER_TEMP/macvm-installer-signing.p12" "$RUNNER_TEMP/MacVM.zip"
