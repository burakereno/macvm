name: Build Windows guest helpers
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-completion]
    paths:
      - .github/workflows/windows-guest-helpers.yml
      - scripts/build-windows-guest-helpers.ps1
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned ARM64 sources
        shell: pwsh
        run: ./scripts/build-windows-guest-helpers.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MacVM-Windows-Guest-Helpers
          path: |
            dist/windows-guest-helpers/
            dist/MacVM-Windows-Guest-Sources.zip
          if-no-files-found: error
