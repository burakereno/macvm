name: Build Windows guest helpers
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [codex/windows-completion]
    paths:
      - .github/workflows/windows-guest-helpers.yml
      - scripts/build-windows-guest-helpers.ps1
permissions:
  contents: read
concurrency:
  group: windows-guest-helpers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      MACVM_BINARY_CACHE: ${{ github.workspace }}/.build/windows-binary-cache
      MACVM_SOURCE_CACHE: ${{ github.workspace }}/.build/windows-source-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: windows-cache
        with:
          path: |
            .build/windows-binary-cache
            .build/windows-source-cache
          key: windows-arm64-release-e456309-${{ hashFiles('scripts/build-windows-guest-helpers.ps1') }}
      - name: Build pinned ARM64 sources
        shell: pwsh
        run: ./scripts/build-windows-guest-helpers.ps1
      - uses: actions/cache/save@v4
        if: always() && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .build/windows-binary-cache
            .build/windows-source-cache
          key: ${{ steps.windows-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: MacVM-Windows-Guest-Helpers
          path: |
            dist/windows-guest-helpers/
            dist/MacVM-Windows-Guest-Sources.zip
          if-no-files-found: error
